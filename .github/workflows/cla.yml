name: "CLA Check"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened,closed,synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    if: ${{ github.repository_owner == 'anyproto' }}
    uses: anyproto/open/.github/workflows/cla.yml@0aa34dbc653ff6c522675bb9bdab8743f34122dc # main as of 2026-11-24
    secrets: inherit
