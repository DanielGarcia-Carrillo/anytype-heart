name: Smoke Tests

on:
  pull_request:
    branches:
      - main

jobs:
  smoke-test:
    if: ${{ github.repository_owner == 'anyproto' }}
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout Test Repository
        run: git clone --depth=1 https://github.com/anyproto/anytype-test.git .

      - name: Create config.yml file from secret
        run: echo "${{ secrets.ANY_SYNC_NETWORK_STAGE1 }}" > config.yml

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          check-latest: true

      - name: Clone anytype-heart with specified branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mw/anytype-heart

      - name: Setup anytype-heart
        run: cd mw/anytype-heart && make setup

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Run smoke tests
        run: npm run test:smoke:testomatio
        env:
          TESTOMATIO: ${{ secrets.TESTOMATIO }}
          GH_PAT: ${{ github.token }}
